<!DOCTYPE html>
<html lang="en" data-style="lumina">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Transitions</title>
    <link rel="icon" type="image/png" href="https://github.com/Subhan-code/Luma-Transitions-Page-Reveal-Animations-/blob/main/luma%20Pinterest%20Logo%20.png?raw=true" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              display: ['Inter', 'system-ui', 'sans-serif'],
              bubble: ['"Rubik Bubbles"', 'cursive'],
            },
            colors: {
              theme: {
                bg: 'var(--c-bg)',
                text: 'var(--c-text)',
                subtext: 'var(--c-subtext)',
                card: 'var(--c-card-bg)',
                border: 'var(--c-border)',
                accent: 'var(--c-accent)',
                'accent-hover': 'var(--c-accent-hover)',
              }
            },
            animation: {
              blob: "blob 10s infinite",
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              marquee: 'marquee 20s linear infinite',
              'spin-slow': 'spin 8s linear infinite',
            },
            keyframes: {
              blob: {
                "0%": {
                  transform: "translate(0px, 0px) scale(1)",
                },
                "33%": {
                  transform: "translate(30px, -50px) scale(1.1)",
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(0.9)",
                },
                "100%": {
                  transform: "translate(0px, 0px) scale(1)",
                },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            },
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Rubik+Bubbles&display=swap');

      :root {
        /* Lumina Light - Deep Purple & Off-White */
        --c-bg: #FDFCF8;
        --c-text: #4B2A8C;
        --c-subtext: #7C5EB8;
        --c-card-bg: #FDFCF8;
        --c-border: #4B2A8C;
        --c-accent: #4B2A8C;
        --c-accent-hover: #341a66;

        --toggle-light: #4B2A8C;
        --toggle-dark: #E0D4F5;
        --sun-disc: transparent;
        --x: 50%;
        --y: 50%;
      }

      html.dark {
        /* Lumina Dark - Inverted */
        --c-bg: #1a0b36;
        --c-text: #E0D4F5;
        --c-subtext: #9d8db5;
        --c-card-bg: #1a0b36;
        --c-border: #E0D4F5;
        --c-accent: #E0D4F5;
        --c-accent-hover: #ffffff;
        --sun-disc: var(--toggle-dark);
      }

      html {
        background: var(--c-bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      body, #root {
        min-height: 100vh;
        margin: 0;
        padding: 0;
        transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        width: 100%;
        overflow-x: hidden;
      }

      /* Noise Texture */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      .dark .bg-noise { opacity: 0.05; }

      /* Lumina Special Outline Text Effect */
      [data-style="lumina"] .lumina-outline-text {
        -webkit-text-stroke: 1.5px var(--c-text);
        color: transparent;
        font-family: 'Rubik Bubbles', cursive;
        letter-spacing: 0.05em;
        line-height: 1.1;
      }
      
      [data-style="lumina"].dark .lumina-outline-text {
        -webkit-text-stroke: 1.5px var(--c-text);
        color: transparent;
      }
      
      /* Vertical Text Utility */
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
      }

      /* Scrollbar aesthetics */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.2);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .dark ::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); }
      
      /* Toggle Styles */
      .toggle {
        display: inline-block;
        position: relative;
        cursor: pointer;
        transform: scale(0.6); 
      }
      .toggle input { display: none; }
      .toggle input + div {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        position: relative;
        box-shadow: inset 16px -16px 0 0 var(--c-text); /* Adapted for themes */
        transform: rotate(-2deg);
        transition: box-shadow .5s ease, transform .4s ease .1s;
      }
      .toggle input + div::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--sun-disc);
        transition: background .3s ease;
      }
      .toggle input + div::after {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -4px;
        box-shadow: 0 -23px 0 var(--c-text), 0 23px 0 var(--c-text), 23px 0 0 var(--c-text), -23px 0 0 var(--c-text), 15px 15px 0 var(--c-text), -15px 15px 0 var(--c-text), 15px -15px 0 var(--c-text), -15px -15px 0 var(--c-text);
        transform: scale(0);
        transition: transform .3s ease;
      }
      .toggle input:checked + div {
        box-shadow: inset 32px -32px 0 0 var(--c-bg);
        transform: scale(.5) rotate(0deg);
      }
      .toggle input:checked + div::before { background: var(--c-text); }
      .toggle input:checked + div::after { transform: scale(1.5); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "gsap": "https://esm.sh/gsap@3.12.2",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-theme-bg text-theme-text transition-colors duration-500">
    <div class="bg-noise"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
